name: autoverpod_example
description: Example app demonstrating autoverpod package usage.
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.2
  freezed_annotation: ^3.1.0
  autoverpod:
    path: ../autoverpod

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.3
  freezed: ^4.0.0
  build_runner: ^2.15.0
  autoverpod_generator:
    path: ../autoverpod_generator

flutter:
  uses-material-design: true

# Use the local annotation package alongside the local runtime and generator.
dependency_overrides:
  autoverpod_annotation:
    path: ../autoverpod_annotation
