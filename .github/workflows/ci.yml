name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compatibility:
    name: Generator / analyzer ${{ matrix.analyzer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - analyzer: '13.3.0'
          - analyzer: '14.0.0'
          - analyzer: '>=13.3.0 <15.0.0'
          - analyzer: '13.3.0'
            older: '--build 4.0.6 --build-runner 2.15.0 --freezed 4.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - run: flutter pub get
      - name: Clean consumer build, analyze, tests, incremental and watch
        run: python3 tool/check_codegen.py --analyzer '${{ matrix.analyzer }}' ${{ matrix.older }}
      - name: Analyze generator against selected dependencies
        # The harness also analyzes its copied generator with the matrix solve.
        run: dart analyze autoverpod_generator autoverpod_annotation

  flutter-package:
    name: Runtime tests and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - run: flutter pub get
      - run: flutter test
        working-directory: autoverpod
      - run: dart format --output=none --set-exit-if-changed autoverpod_generator/lib autoverpod_generator/test tool/integration
